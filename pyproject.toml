[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "octdenoiser"
version = "1.0.0"
description = "Self-supervised NAFNet denoising for processed OCT B-scans"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Eric Tang", email = "eric.tang22@gmail.com" }]
keywords = ["OCT", "denoising", "self-supervised", "medical-imaging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "License :: OSI Approved :: MIT License",
]

# First-order dependencies only. The previous requirements.txt was a pip freeze
# in which ~25 of 32 pins were transitive.
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "tifffile>=2024.1.30",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
oct-train = "octdenoiser.cli.train:main"
oct-predict = "octdenoiser.cli.predict:main"

[project.urls]
Repository = "https://github.com/tangericm/OCT-Denoiser"
Issues = "https://github.com/tangericm/OCT-Denoiser/issues"
Project = "https://ericmtang.com/projects/denoiser"

[tool.hatch.build.targets.wheel]
packages = ["src/octdenoiser"]

# ---------------------------------------------------------------------------
# torch is intentionally NOT pinned to a CUDA index here: doing so would force
# multi-GB CUDA wheels onto CPU-only CI. Install the accelerator build first,
# then the package:
#
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
#   pip install -e ".[dev]"
#
# CPU-only (CI, or a machine without CUDA): swap cu128 for cpu.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a few seconds",
    "needs_cuda: requires a CUDA device",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function call in default arg — used deliberately for dataclasses
    "SIM108", # ternary rewrites hurt readability in the numeric code
    "C408",   # dict(...) for kwargs splatting reads better than a literal here
    "E702",   # `lo = ...; hi = ...` keeps paired numeric bounds on one line
]

[tool.ruff.lint.per-file-ignores]
"src/octdenoiser/networks/__init__.py" = ["F401"]  # side-effect registration

[tool.mypy]
python_version = "3.10"
files = ["src/octdenoiser"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true

# Third-party sources are not ours to type-check, and parsing them under our
# python_version target breaks: mypy applies python_version=3.10 semantics to
# every file it follows, so a dependency written with 3.12+ syntax (PEP 695
# `type` statements in tifffile) is a hard syntax error. CI caught this on the
# 3.12 job while 3.11 passed, because pip resolved an older tifffile there.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "tifffile.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
